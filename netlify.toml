[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[dev]
  command = "npm run dev:ui"
  targetPort = 5173
  port = 8888
  framework = "vite"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
